services:
  hawser:
    container_name: hawser
    image: ghcr.io/finsys/hawser:0.2.26
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/hawser/stacks:/opt/hawser/stacks
    environment:
      DOCKHAND_SERVER_URL: ${DOCKHAND_SERVER_URL:?set DOCKHAND_SERVER_URL in .env}
      TOKEN: ${HAWSER_TOKEN:?set HAWSER_TOKEN in .env}
      AGENT_NAME: ${AGENT_NAME:?set AGENT_NAME in .env}
      STACKS_DIR: /opt/hawser/stacks
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
