services:
  dockhand:
    container_name: dockhand
    image: fnsys/dockhand:v1.0.47
    restart: unless-stopped
    ports:
      - 3000:3000
    group_add:
      - ${DOCKER_GID:?set DOCKER_GID in .env}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/dockhand:/opt/dockhand
    environment:
      DATA_DIR: /opt/dockhand
      HOST_DOCKER_SOCKET: /var/run/docker.sock
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      DOCKHAND_HOSTNAME: core-pi
      COMPOSE_TIMEOUT: 1800
      TRUST_FORWARDED_HEADERS: "true"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
